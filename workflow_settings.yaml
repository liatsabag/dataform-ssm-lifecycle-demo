# Google Cloud Dataform Workflow Settings
# Topology: DEV by default for developer isolation, dynamic PROD source parameterization

defaultProject: df-demo-dev-054f2
defaultDataset: analytics_curated
defaultLocation: me-west1
defaultAssertionDataset: dataform_assertions
dataformCoreVersion: 3.0.0

# Custom compilation variables (Anti-Hijacking Pattern)
# source_project is hardlocked to PROD so global overrides do not alter the source reading path
vars:
  source_project: df-demo-prod-352ca
  source_dataset: raw_vault
